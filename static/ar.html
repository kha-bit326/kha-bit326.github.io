<title>AR キャラクター</title>
<style>
:root {
  --bg:       #0e0b1a;
  --surface:  #1c1830;
  --pink:     #ff85b8;
  --lavender: #c4a8ff;
  --mint:     #8df5d0;
  --fg:       #f5f0ff;
  --muted:    #7a6e99;
  --glass:    rgba(255,255,255,0.07);
  --shadow:   0 8px 32px rgba(0,0,0,0.55);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f0ecfa;
    --surface: #ffffff;
    --fg:      #1a1430;
    --muted:   #7a6e99;
    --glass:   rgba(255,255,255,0.6);
    --shadow:  0 8px 32px rgba(100,80,180,0.18);
  }
}
:root[data-theme="dark"]  { --bg:#0e0b1a;--surface:#1c1830;--fg:#f5f0ff;--muted:#7a6e99;--glass:rgba(255,255,255,0.07);--shadow:0 8px 32px rgba(0,0,0,0.55); }
:root[data-theme="light"] { --bg:#f0ecfa;--surface:#fff;--fg:#1a1430;--muted:#7a6e99;--glass:rgba(255,255,255,0.6);--shadow:0 8px 32px rgba(100,80,180,0.18); }

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Hiragino Maru Gothic ProN','Hiragino Maru Gothic Pro',
               'BIZ UDPGothic','Noto Sans JP',-apple-system,sans-serif;
  min-height: 100dvh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Orbs */
.orb-wrap { position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0; }
.orb { position:absolute;border-radius:50%;filter:blur(80px);animation:drift 14s ease-in-out infinite alternate; }
.orb-a { width:520px;height:520px;background:var(--pink);top:-180px;left:-120px;opacity:.25;animation-delay:0s; }
.orb-b { width:400px;height:400px;background:var(--lavender);bottom:-120px;right:-80px;opacity:.22;animation-delay:-5s; }
.orb-c { width:280px;height:280px;background:var(--mint);top:40%;left:55%;opacity:.12;animation-delay:-9s; }
@keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,40px) scale(1.12)} }

/* ── Upload Screen ── */
#upload-screen {
  position:relative; z-index:1;
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  justify-content:space-between;
  padding: max(env(safe-area-inset-top,0px),52px) 1.5rem max(env(safe-area-inset-bottom,0px),44px);
}
.upload-header {
  display:flex; flex-direction:column; align-items:center;
  gap:.7rem; text-align:center; width:100%;
}
.upload-middle {
  display:flex; flex-direction:column; align-items:center;
  gap:.75rem; width:100%;
}
.upload-footer { width:100%; }

.logo-icon { font-size:2.8rem;line-height:1;filter:drop-shadow(0 0 16px var(--pink));animation:pulse-icon 3s ease-in-out infinite; }
@keyframes pulse-icon { 0%,100%{filter:drop-shadow(0 0 10px var(--pink))} 50%{filter:drop-shadow(0 0 24px var(--lavender))} }

h1 {
  font-size:1.7rem; font-weight:900; letter-spacing:-.01em; line-height:1.15;
  background:linear-gradient(130deg, var(--pink) 0%, var(--lavender) 55%, var(--mint) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  text-wrap:balance; text-align:center;
}
.tagline { font-size:.85rem;color:var(--muted);text-align:center;line-height:1.7; }

.dz-card {
  width:100%;
  background:var(--glass);
  border:1.5px dashed rgba(196,168,255,.35);
  border-radius:24px; padding:2rem 1.5rem;
  text-align:center; cursor:pointer;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  transition:border-color .22s, background .22s, transform .15s;
}
.dz-card:hover,.dz-card.over { border-color:var(--pink);background:rgba(255,133,184,.1);transform:translateY(-2px); }
.dz-card:active { transform:scale(.98); }
.dz-emoji { font-size:3.5rem;display:block;margin-bottom:.8rem;line-height:1; }
.dz-text  { font-size:.9rem;color:var(--muted);margin-bottom:1.4rem;line-height:1.6; }

/* CutOut サイズ基準ボタン */
.btn-upload {
  width:100%;
  height:72px; border-radius:36px;
  background:linear-gradient(135deg, var(--pink), var(--lavender));
  color:#fff; border:none;
  font-size:1.25rem; font-weight:700; font-family:inherit;
  cursor:pointer; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  box-shadow:0 4px 20px rgba(255,133,184,.45);
  transition:opacity .15s, transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.btn-upload:active { opacity:.85; transform:scale(.97); }

.tips { display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%; }
.tip {
  background:var(--glass); border:1px solid rgba(255,255,255,.1);
  border-radius:16px; padding:1rem 1.1rem;
  font-size:.9rem; color:var(--muted); line-height:1.5;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.tip strong { display:block;color:var(--fg);font-size:.95rem;margin-bottom:.25rem; }

#err {
  font-size:.82rem; color:#ff7070;
  background:rgba(255,80,80,.1); border:1px solid rgba(255,80,80,.25);
  border-radius:10px; padding:.55rem 1rem;
  display:none; max-width:320px; text-align:center;
}

/* ── AR Screen ── */
#ar-screen { display:none;position:fixed;inset:0;z-index:10; }

#canvas { position:absolute;inset:0;touch-action:none;cursor:crosshair; }

/* Top HUD */
#hud-top {
  position:absolute;
  top:max(env(safe-area-inset-top,0px),14px);
  left:0; right:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:0 14px; pointer-events:none;
}
.hud-pill {
  background:rgba(14,11,26,.62);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12); border-radius:50px;
  padding:.4rem 1rem; font-size:.78rem;
  color:rgba(245,240,255,.85); white-space:nowrap;
  transition:opacity .5s;
}
.hud-badge {
  background:rgba(14,11,26,.62);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12); border-radius:50px;
  padding:.4rem 1rem; font-size:.78rem;
  color:var(--lavender); font-weight:700; font-variant-numeric:tabular-nums;
}

/* Bottom HUD — 2列グリッド */
#hud-bottom {
  position:absolute; bottom:0; left:0; right:0;
  padding:1rem 1.2rem max(env(safe-area-inset-bottom,0px),1.2rem);
  background:linear-gradient(to top, rgba(14,11,26,.92) 0%, rgba(14,11,26,.55) 65%, transparent 100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:80px 80px;
  gap:.75rem;
}

/* 共通ボタンベース */
.ar-btn {
  height:80px; border-radius:40px;
  border:none; cursor:pointer; font-family:inherit;
  font-size:1.15rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:.45rem;
  transition:transform .12s, opacity .12s;
  -webkit-tap-highlight-color:transparent;
}
.ar-btn:active { transform:scale(.95); opacity:.85; }

/* 📸 撮影する — 右上 */
#shutter {
  grid-column:2; grid-row:1;
  background:linear-gradient(135deg, var(--pink) 0%, var(--lavender) 100%);
  color:#fff; letter-spacing:.02em;
  box-shadow:0 4px 20px rgba(255,133,184,.5);
}

/* 🗑 全削除 — 左上 */
#del-btn {
  grid-column:1; grid-row:1;
  background:rgba(28,24,48,.88);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(245,240,255,.9);
}

/* ✨ 背景除去 — 左下 */
#blend-btn {
  grid-column:1; grid-row:2;
  background:rgba(28,24,48,.88);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(245,240,255,.9);
}
#blend-btn.on { border-color:rgba(255,133,184,.7); color:var(--pink); background:rgba(255,133,184,.15); }

/* ← 戻る — 右下 */
#back-btn {
  grid-column:2; grid-row:2;
  background:rgba(28,24,48,.88);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(245,240,255,.55);
  font-weight:600;
}

/* Flash animation on capture */
#flash {
  position:absolute; inset:0;
  background:#fff; opacity:0; pointer-events:none;
  transition:opacity .08s;
}
#flash.go { opacity:.85; }
</style>

<!-- Ambient orbs (upload screen only) -->
<div class="orb-wrap" id="orb-wrap">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<!-- ── Upload Screen ── -->
<div id="upload-screen">

  <!-- 上部：タイトル -->
  <div class="upload-header">
    <span class="logo-icon">🌸</span>
    <h1>AR キャラクター</h1>
    <p class="tagline">画像をアップロードして<br>カメラの世界にキャラを召喚しよう</p>
  </div>

  <!-- 中央：ドロップゾーン -->
  <div class="upload-middle">
    <div class="dz-card" id="dz">
      <span class="dz-emoji">📷</span>
      <p class="dz-text">キャラクター画像をここにドロップ<br>または</p>
      <button class="btn-upload" onclick="document.getElementById('fi').click()">🖼️ 画像を選択</button>
    </div>
    <input type="file" id="fi" accept="image/*" style="display:none">
    <p id="err"></p>
  </div>

  <!-- 下部：操作ヒント -->
  <div class="upload-footer">
    <div class="tips">
      <div class="tip"><strong>👆 タップ</strong>キャラを配置</div>
      <div class="tip"><strong>✌️ ピンチ</strong>拡大・縮小</div>
      <div class="tip"><strong>👋 ドラッグ</strong>位置を移動</div>
      <div class="tip"><strong>💥 2回タップ</strong>削除</div>
    </div>
  </div>

</div>

<!-- ── AR Screen ── -->
<div id="ar-screen">
  <canvas id="canvas"></canvas>
  <div id="flash"></div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-pill" id="hint">画面をタップして配置</div>
    <div class="hud-badge" id="count">0 体</div>
  </div>

  <!-- Bottom HUD — 2列グリッド -->
  <div id="hud-bottom">
    <button class="ar-btn" id="del-btn"   onclick="clearAll()">🗑 全削除</button>
    <button class="ar-btn" id="shutter"   onclick="capture()">📸 撮影する</button>
    <button class="ar-btn on" id="blend-btn" onclick="toggleBlend()">✨ 背景除去 ON</button>
    <button class="ar-btn" id="back-btn"  onclick="goBack()">← 戻る</button>
  </div>
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>

<script>
'use strict';

// ── State ──
let img = null;
let processedImg = null; // black bg removed (offscreen canvas)
let useProcessed = true; // true = pixel-processed, false = screen blend

let canvas, ctx, video;
let W = 0, H = 0, dpr = 1;
let objs = [];  // { x, y, scale, born, bob }
let ptrs = new Map();
let drag = null, pinch = null, lastTap = null;
let hintTimer = null, raf = null;
let ripples = [];

// ── Upload ──
const dz = document.getElementById('dz');
const fi = document.getElementById('fi');
const errEl = document.getElementById('err');

fi.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});

function loadFile(file) {
  errEl.style.display = 'none';
  const reader = new FileReader();
  reader.onload = e => {
    const image = new Image();
    image.onload = () => { img = image; processedImg = removeBlackBg(img); startAR(); };
    image.onerror = () => showErr('画像を読み込めませんでした。');
    image.src = e.target.result;
  };
  reader.onerror = () => showErr('ファイルの読み込みに失敗しました。');
  reader.readAsDataURL(file);
}

function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }

// ── Black BG Removal ──
function removeBlackBg(src) {
  const oc = document.createElement('canvas');
  oc.width  = src.naturalWidth  || src.width;
  oc.height = src.naturalHeight || src.height;
  const octx = oc.getContext('2d');
  octx.drawImage(src, 0, 0);

  const id = octx.getImageData(0, 0, oc.width, oc.height);
  const d  = id.data;

  for (let i = 0; i < d.length; i += 4) {
    const maxC = Math.max(d[i], d[i+1], d[i+2]);
    if (maxC < 14) {
      // Pure black → fully transparent
      d[i+3] = 0;
    } else if (maxC < 40) {
      // Near-black → smooth fade
      d[i+3] = Math.round(((maxC - 14) / 26) * d[i+3]);
    }
  }

  octx.putImageData(id, 0, 0);
  return oc;
}

// ── AR Start ──
async function startAR() {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('orb-wrap').style.display = 'none';
  document.getElementById('ar-screen').style.display = 'block';

  canvas = document.getElementById('canvas');
  ctx    = canvas.getContext('2d');
  video  = document.getElementById('video');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    console.warn('Camera:', e.message);
  }

  onResize();
  window.addEventListener('resize', onResize);

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup',   onUp,   { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });

  raf = requestAnimationFrame(loop);
  setHint('画面をタップしてキャラを配置', 3500);
}

// ── Resize ──
function onResize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}

// ── Render ──
function loop(t) {
  draw(t);
  raf = requestAnimationFrame(loop);
}

function draw(t) {
  // Camera or fallback
  if (video && video.readyState >= 2 && video.videoWidth > 0) {
    drawCamera();
  } else {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1a1130'); g.addColorStop(1, '#0e0b1a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Ripples
  ripples = ripples.filter(r => t - r.born < 600);
  for (const r of ripples) {
    const p = (t - r.born) / 600;
    ctx.save();
    ctx.strokeStyle = `rgba(255,133,184,${(1-p)*0.6})`;
    ctx.lineWidth   = 2.5 * (1-p);
    ctx.beginPath(); ctx.arc(r.x, r.y, p * 60, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Characters
  for (const o of objs) drawObj(o, t);

  document.getElementById('count').textContent = objs.length + ' 体';
}

function drawCamera() {
  const vW = video.videoWidth, vH = video.videoHeight;
  if (!vW || !vH) return;
  const sc = Math.max(W/vW, H/vH);
  ctx.drawImage(video, (W - vW*sc)/2, (H - vH*sc)/2, vW*sc, vH*sc);
}

function drawObj(o, t) {
  const src = useProcessed ? processedImg : img;
  const iW = src.width || src.naturalWidth;
  const iH = src.height || src.naturalHeight;

  const baseW = Math.min(W, H) * 0.45;
  const dw = o.scale * baseW;
  const dh = (iH / iW) * dw;

  // Pop-in
  const age = t - o.born;
  const sc = age < 380 ? easeOutBack(Math.min(age/380, 1)) : 1;

  // Float bob
  const bob = Math.sin(t * 0.0012 + o.bob) * 5;

  ctx.save();

  if (sc !== 1) {
    ctx.translate(o.x, o.y + bob);
    ctx.scale(sc, sc);
    ctx.translate(-o.x, -(o.y + bob));
  }

  if (!useProcessed) {
    // Screen blend removes black on the fly
    ctx.globalCompositeOperation = 'screen';
  }

  ctx.drawImage(src, o.x - dw/2, o.y - dh/2 + bob, dw, dh);
  ctx.restore();
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}

// ── Pointer ──
function cpos(e) { const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

function hitObj(x, y) {
  const src  = useProcessed ? processedImg : img;
  const iW   = src.width || src.naturalWidth;
  const iH   = src.height || src.naturalHeight;
  const baseW = Math.min(W,H)*0.45;
  for (let i=objs.length-1; i>=0; i--) {
    const o=objs[i]; const dw=o.scale*baseW; const dh=(iH/iW)*dw;
    if (x>=o.x-dw/2 && x<=o.x+dw/2 && y>=o.y-dh/2 && y<=o.y+dh/2) return i;
  }
  return -1;
}

function onDown(e) {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const p = cpos(e); ptrs.set(e.pointerId, p);

  if (ptrs.size === 2) {
    drag = null;
    const v = [...ptrs.values()];
    const cx=(v[0].x+v[1].x)/2, cy=(v[0].y+v[1].y)/2;
    let idx = hitObj(cx,cy);
    if (idx<0) { let bd=Infinity; objs.forEach((o,i)=>{ const d=Math.hypot(o.x-cx,o.y-cy); if(d<bd){bd=d;idx=i;} }); }
    if (idx>=0) { const d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y); pinch={idx,d0:d,s0:objs[idx].scale}; }
    return;
  }

  const idx = hitObj(p.x, p.y);
  const now = performance.now();

  if (idx >= 0) {
    if (lastTap && now-lastTap.time<320 && lastTap.idx===idx && Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<44) {
      objs.splice(idx,1); drag=null; lastTap=null;
      setHint('削除しました ✓', 1400); return;
    }
    lastTap = {time:now, x:p.x, y:p.y, idx};
    drag = {idx, ox:p.x-objs[idx].x, oy:p.y-objs[idx].y};
  } else {
    ripples.push({x:p.x, y:p.y, born:now});
    objs.push({x:p.x, y:p.y, scale:1, born:now, bob:Math.random()*Math.PI*2});
    const ni = objs.length-1;
    drag = {idx:ni, ox:0, oy:0};
    lastTap = {time:now, x:p.x, y:p.y, idx:ni};
    if (objs.length===1) setHint('ドラッグで移動 • ダブルタップで削除', 2500);
  }
}

function onMove(e) {
  e.preventDefault();
  const p = cpos(e); ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size>=2) {
    const v=[...ptrs.values()];
    const d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    objs[pinch.idx].scale = Math.max(0.15, Math.min(5, (d/pinch.d0)*pinch.s0));
  } else if (drag && ptrs.size===1) {
    objs[drag.idx].x = p.x - drag.ox;
    objs[drag.idx].y = p.y - drag.oy;
  }
}
function onUp(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch=null;
  if (ptrs.size===0) drag=null;
}

// ── Controls ──
function toggleBlend() {
  useProcessed = !useProcessed;
  const btn = document.getElementById('blend-btn');
  btn.textContent = useProcessed ? '✨ 背景除去 ON' : '🖼 背景除去 OFF';
  btn.classList.toggle('on', useProcessed);
}

function clearAll() {
  objs=[]; ripples=[];
  setHint('全て削除しました', 1500);
}

async function capture() {
  // Flash effect
  const flashEl = document.getElementById('flash');
  flashEl.classList.add('go');
  setTimeout(() => flashEl.classList.remove('go'), 160);

  canvas.toBlob(async blob => {
    const file = new File([blob], `ar-${Date.now()}.png`, {type:'image/png'});

    // Try Web Share API (iOS / Android)
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:'ARキャラクター'}); return; }
      catch(e) { /* Cancelled or failed, fall through to download */ }
    }

    // Fallback: download
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href = url; a.download = `ar-${Date.now()}.png`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function goBack() {
  cancelAnimationFrame(raf);
  if (video?.srcObject) { video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; }
  window.removeEventListener('resize', onResize);
  canvas.removeEventListener('pointerdown', onDown);
  canvas.removeEventListener('pointermove', onMove);
  canvas.removeEventListener('pointerup',   onUp);
  canvas.removeEventListener('pointercancel', onUp);
  objs=[]; ripples=[]; ptrs.clear(); drag=pinch=lastTap=null;
  document.getElementById('ar-screen').style.display = 'none';
  document.getElementById('orb-wrap').style.display  = 'block';
  document.getElementById('upload-screen').style.display = 'flex';
}

function setHint(text, dur) {
  const el=document.getElementById('hint');
  el.textContent=text; el.style.opacity='1';
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ el.style.opacity='0'; }, dur);
}
</script>
