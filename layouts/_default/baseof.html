<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "ja" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | plainify | truncate 120 }}{{ end }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --warm-bg: #faf7f2;
            --warm-surface: #f3ede4;
            --warm-green: #7a9e7e;
            --warm-text: #3d3530;
            --warm-muted: #8a7d74;
            --warm-border: #e0d8cf;
            --warm-accent: #c4845a;
        }
        body {
            font-family: 'Noto Sans JP', 'Lato', sans-serif;
            font-weight: 300;
            background-color: var(--warm-bg);
            color: var(--warm-text);
            scroll-behavior: smooth;
        }
        .article-content h2 {
            font-size: 1.4em; font-weight: 500;
            color: var(--warm-green);
            border-bottom: 2px solid var(--warm-border);
            padding-bottom: 0.3em; margin: 2em 0 0.8em;
        }
        .article-content h3 {
            font-size: 1.15em; font-weight: 500;
            color: var(--warm-text); margin: 1.6em 0 0.6em;
        }
        .article-content p { margin-bottom: 1.4em; line-height: 1.9; color: var(--warm-text); }
        .article-content a { color: var(--warm-accent); text-decoration: underline; text-underline-offset: 3px; }
        .article-content ul { list-style: disc; margin: 1em 0 1.4em 1.5em; }
        .article-content ol { list-style: decimal; margin: 1em 0 1.4em 1.5em; }
        .article-content li { margin-bottom: 0.5em; line-height: 1.85; }
        .article-content blockquote {
            border-left: 4px solid var(--warm-green);
            background: var(--warm-surface);
            padding: 0.8rem 1.2rem; margin: 1.5em 0;
            border-radius: 0 0.75rem 0.75rem 0;
            color: var(--warm-muted); font-style: italic;
        }
        .article-content img {
            border-radius: 1rem; max-width: 100%;
            box-shadow: 0 8px 24px rgba(122,158,126,0.15);
            margin: 2em auto;
        }
        .article-content hr { border: none; border-top: 1px solid var(--warm-border); margin: 2em 0; }
        .article-content table { width: 100%; border-collapse: collapse; margin: 1.5em 0; }
        .article-content th, .article-content td { border: 1px solid var(--warm-border); padding: 0.6rem 1rem; }
        .article-content th { background: var(--warm-surface); font-weight: 500; }
    </style>
</head>
<body>
    {{ partial "nav.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
</body>
</html>
