<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "ja" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | plainify | truncate 120 }}{{ end }}">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            scroll-behavior: smooth;
        }
        /* 記事本文スタイル */
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4 {
            font-weight: 700;
            margin: 2em 0 0.6em;
            line-height: 1.3;
        }
        .article-content h1 { font-size: 2em; }
        .article-content h2 { font-size: 1.5em; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.3em; }
        .article-content h3 { font-size: 1.25em; }
        .article-content p { margin-bottom: 1.4em; line-height: 1.85; color: #374151; }
        .article-content a { color: #4F46E5; text-decoration: underline; }
        .article-content ul { list-style: disc; margin: 1em 0 1.4em 1.5em; }
        .article-content ol { list-style: decimal; margin: 1em 0 1.4em 1.5em; }
        .article-content li { margin-bottom: 0.5em; line-height: 1.8; color: #374151; }
        .article-content code {
            background: #f3f4f6;
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.875em;
            font-family: 'Fira Code', 'Courier New', monospace;
        }
        .article-content pre {
            background: #111827;
            color: #f9fafb;
            padding: 1.25rem 1.5rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 1.5em 0;
        }
        .article-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.875em;
        }
        .article-content img {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: 2em auto;
            max-width: 100%;
        }
        .article-content blockquote {
            border-left: 4px solid #4F46E5;
            padding: 0.5rem 1rem;
            margin: 1.5em 0;
            color: #6B7280;
            font-style: italic;
            background: #f9fafb;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
        }
        .article-content th,
        .article-content td {
            border: 1px solid #e5e7eb;
            padding: 0.6rem 1rem;
        }
        .article-content th { background: #f3f4f6; font-weight: 600; }
        .article-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 2em 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    {{ partial "nav.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
</body>
</html>
